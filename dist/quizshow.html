r(--text)}.ladder__step.is-safe .ladder__points{color:var(--gold)}.ladder__step.is-done,.ladder__step.is-done .ladder__points{color:#6ff0a8}.ladder__step.is-current{background:linear-gradient(90deg,var(--locked),#ffc940);color:#1b1400}.ladder__step.is-current .ladder__points{color:#1b1400}.ladder__step.is-failed{background:var(--wrong);color:#fff}.ladder__step.is-failed .ladder__points{color:#fff}@media(max-width:860px){.game--ladder{grid-template-columns:1fr}.ladder{display:none}}.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:4vh}.result__icon{font-size:4.5rem;animation:pop .5s ease-out}.result__title{margin:0;font-size:clamp(2rem,6vw,3.4rem);color:var(--gold)}.result__points{margin:0;font-size:1.4rem;color:var(--muted)}.result__points strong{display:block;font-size:clamp(2.6rem,9vw,4.5rem);color:var(--text);font-variant-numeric:tabular-nums}.result__sub{margin:0;color:var(--muted)}.result--lost .result__title{color:#ff8a84}@keyframes pop{0%{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}.review{width:100%;text-align:left}.review__list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}.review__q{font-weight:600}.review__a{color:#6ff0a8}.review__x{color:var(--muted);font-size:.9rem}.dialog{color:var(--text);background:#1d1650;border:1px solid var(--panel-border);border-radius:var(--radius);padding:22px;max-width:min(92vw,420px);box-shadow:0 20px 60px #0009}.dialog::backdrop{background:#050314b3}.dialog__title{margin:0 0 8px;font-size:1.3rem}.dialog__text{margin:0 0 18px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%);z-index:10;max-width:min(92vw,520px);background:#2a2163;border:1px solid var(--panel-border);border-radius:12px;padding:12px 18px;box-shadow:0 10px 30px #00000080;transition:opacity .5s}.toast.is-leaving{opacity:0}.footer{text-align:center;color:var(--muted);font-size:.8rem}:focus-visible{outline:3px solid var(--gold)
