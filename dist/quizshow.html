abled),.answer:focus-visible{border-color:var(--gold)}.answer:active:not(:disabled){transform:scale(.98)}.answer:disabled{cursor:default}.answer__key{color:var(--gold);font-weight:900;min-width:1.4em}.answer__mark{margin-left:auto;font-size:1.3rem}.answer.is-right{background:var(--right);border-color:#8ff0bd}.answer.is-wrong{background:var(--wrong);border-color:#ffb3ae}.explanation{text-align:center;color:var(--muted);margin:0}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.btn{font:inherit;font-weight:700;cursor:pointer;padding:12px 22px;border-radius:999px;border:none;color:#1b1400;background:linear-gradient(180deg,#ffe08a,var(--gold))}.btn--ghost{background:transparent;color:var(--text);border:1px solid var(--panel-border)}.footer{text-align:center;color:var(--muted);font-size:.8rem}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
