name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kataloge validieren
        run: npm run validate
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: dist/quizshow.html ist aktuell
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/quizshow.html passt nicht zum Quellstand – bitte 'npm run build' ausführen und committen."
            git diff --stat -- dist/
            exit 1
          fi
